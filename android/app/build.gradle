plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grokweb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.grokweb.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
        ndk {
            // real phones only — drops x86/x86_64 emulator libs (ML Kit native)
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // ML Kit pulls kotlin-stdlib-jdk7/jdk8 1.6.21 while AndroidX brings stdlib
    // 1.8.22; since Kotlin 1.8 merged the jdk7/jdk8 artifacts into the main
    // stdlib, the mismatch produces duplicate classes. Align them to 1.8.22
    // (where jdk7/jdk8 are empty shims) to resolve it.
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}

dependencies {
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.activity:activity:1.9.2"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
