<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Grok</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <div id="app" class="app">
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand" title="Grok Web">
          <span class="brand-mark">✦</span>
          <span class="brand-text">Grok</span>
        </div>
        <button type="button" id="sidebar-close" class="icon-btn mobile-only" title="關閉選單" aria-label="關閉選單">✕</button>
        <button type="button" id="sidebar-collapse" class="icon-btn desktop-only" title="收合側欄" aria-label="收合側欄">«</button>
      </div>

      <button type="button" id="new-chat" class="new-chat-btn" title="開新對話">
        <span class="new-chat-icon">＋</span>
        <span class="new-chat-label">New chat</span>
      </button>

      <div id="session-list" class="session-list" role="list"></div>

      <div class="sidebar-footer">
        <div id="conn" class="conn" title="連線狀態">●</div>
        <button type="button" id="theme-toggle" class="icon-btn" title="切換深淺色" aria-label="切換深淺色">◐</button>
        <button type="button" id="settings-btn" class="icon-btn" title="設定與用量" aria-label="設定">⚙</button>
        <button type="button" id="refresh" class="icon-btn" title="重新整理列表" aria-label="重新整理">↻</button>
      </div>
    </aside>

    <main id="main" class="main is-empty">
      <header class="topbar">
        <button type="button" id="menu-btn" class="icon-btn mobile-only" title="選單" aria-label="開啟選單">☰</button>
        <button type="button" id="sidebar-expand" class="icon-btn desktop-only hidden" title="展開側欄" aria-label="展開側欄">»</button>
        <div class="chat-title" id="chat-title">Grok</div>
        <button type="button" id="close-chat" class="icon-btn hidden" title="關閉對話" aria-label="關閉對話">✕</button>
      </header>

      <div id="stage" class="stage">
        <section id="empty" class="empty-state">
          <div class="empty-inner">
            <div class="empty-logo">Grok</div>
            <p class="empty-sub">How can I help?</p>
            <p class="empty-hint">從左側選擇對話，或建立 New chat</p>
          </div>
        </section>

        <section id="chat" class="chat-panel hidden">
          <div id="messages" class="messages"></div>
        </section>
      </div>

      <div class="composer-dock">
        <div id="slash-menu" class="slash-menu hidden"></div>
        <div id="attach-bar" class="attach-bar hidden"></div>
        <div id="composer" class="composer">
          <button type="button" id="attach" class="attach-btn" title="附加圖片或檔案" aria-label="附加">＋</button>
          <input id="file-input" type="file" multiple hidden />
          <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
          <button type="button" id="interject" class="interject hidden" title="插話：打斷目前回合並立即送出" aria-label="插話">⏭</button>
          <button type="button" id="send" class="send" title="送出" aria-label="送出">↑</button>
          <button type="button" id="stop" class="stop hidden" title="停止" aria-label="停止">■</button>
        </div>
      </div>
    </main>
  </div>

  <!-- New chat dialog -->
  <div id="newchat-backdrop" class="sheet-backdrop hidden"></div>
  <section id="newchat" class="modal hidden" role="dialog" aria-labelledby="nc-title">
    <h3 id="nc-title">開新對話</h3>
    <label class="modal-label" for="nc-cwd">工作目錄（session 綁定的資料夾）</label>
    <input id="nc-cwd" class="modal-input" type="text" placeholder="C:\Users\...\your-project" autocomplete="off" />
    <div id="nc-recent" class="chip-wrap"></div>
    <label class="modal-label" for="nc-model">模型</label>
    <select id="nc-model" class="modal-input"></select>
    <div id="nc-error" class="modal-error"></div>
    <div class="modal-actions">
      <button type="button" id="nc-cancel" class="chip">取消</button>
      <button type="button" id="nc-create" class="primary-btn">建立並開始</button>
    </div>
  </section>

  <!-- Settings bottom sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" role="dialog" aria-label="設定">
    <div class="sheet-handle"></div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <script src="/app.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
