<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Grok Web</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <!-- Session picker -->
  <section id="picker" class="view">
    <header class="topbar">
      <div class="brand">Grok<span>Web</span></div>
      <button id="settings-picker" class="ghost" title="設定與用量">⚙</button>
      <button id="refresh" class="ghost" title="重新整理">↻</button>
    </header>
    <div id="session-list" class="session-list"></div>
    <p class="hint">在終端機用 <code>grok</code> 建立/開啟對話，這裡選一個即可在網頁繼續。</p>
  </section>

  <!-- Chat -->
  <section id="chat" class="view hidden">
    <header class="topbar">
      <button id="back" class="ghost" title="返回">‹</button>
      <div class="chat-title" id="chat-title">對話</div>
      <button id="settings-chat" class="ghost" title="設定與用量">⚙</button>
      <div id="conn" class="conn" title="連線狀態">●</div>
    </header>
    <div id="messages" class="messages"></div>
    <div id="slash-menu" class="slash-menu hidden"></div>
    <div id="attach-bar" class="attach-bar hidden"></div>
    <div id="composer" class="composer">
      <button id="attach" class="attach-btn" title="附加圖片或檔案">＋</button>
      <input id="file-input" type="file" multiple hidden />
      <textarea id="input" rows="1" placeholder="傳訊息給 Grok…（輸入 / 看指令）" autocomplete="off"></textarea>
      <button id="send" class="send" title="送出">↑</button>
      <button id="stop" class="stop hidden" title="停止">■</button>
    </div>
  </section>

  <!-- Settings bottom sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <section id="sheet" class="sheet hidden">
    <div class="sheet-handle"></div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <script src="/app.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
